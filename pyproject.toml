[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-binance",
    "happybase",
    "kafka-python",
    "pandas",
    "numpy",
    "aiohttp",
    "aiofiles",
    "aiocsv",
    "async_unzip",
    "tqdm",
]

[project.optional-dependencies]
api       = ["fastapi", "httptools==0.1.*", "uvloop", "uvicorn"]
dashboard = ["dash", "requests", "dash_bootstrap_components"]
dev       = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
python_files = ["test_*.py", "*_tests.py"]

[tool.coverage.run]
source = ["src/opa"]
omit = [
    "src/opa/storage/*",
    "src/opa/harvest/*",
    "src/opa/trading/bot.py",
    "src/opa/trading/builder.py",
    "src/opa/trading/wallet.py",
    "src/opa/trading/signal.py",
    "src/opa/process/exponential_moving_averages.py",
    "src/opa/logging_config.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true