[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-binance",
    "happybase",
    "kafka-python",
    "pandas",
    "numpy",
    "aiohttp",
    "aiofiles",
    "aiocsv",
    "async_unzip",
    "tqdm",
]

[project.optional-dependencies]
api       = ["fastapi", "httptools==0.1.*", "uvloop", "uvicorn"]
dashboard = ["dash", "requests", "dash_bootstrap_components"]
dev       = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]