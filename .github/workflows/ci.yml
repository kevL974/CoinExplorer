name: ci
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run linter (Ruff)
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache talib_compilation
        id: cache-talib
        uses: actions/cache@v5
        with:
          path: |
            /usr/lib/libta_lib* 
            /usr/include/ta-lib
          key: ${{ runner.os }}-talib

      - name: Install TA-LIB
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: sh install_talib.sh

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run test
        run: pytest --cov --cov-report=term-missing

  build-docker:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build api image
        run: docker build . -f docker/api/Dockerfile

      - name: Build collect_hd image
        run: docker build . -f docker/collectors/historic/Dockerfile

      - name: Build collect_sd image
        run: docker build . -f docker/collectors/stream/Dockerfile

      - name: Build stream2hbase image
        run: docker build . -f docker/pipeline/hbase/Dockerfile
